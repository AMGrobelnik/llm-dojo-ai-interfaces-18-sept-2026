# Same-source pairwise cost-per-task ratios.
#
# THE RULE: a ratio may only relate two models measured on the SAME tasks
# in the SAME published run. Nothing here mixes two sources — chaining
# across sources is the ranker's job (scripts/rank_llms.py solves the
# whole graph at once), not the data's.
#
# `ratio` is cost(model_a) / cost(model_b) as published. Every row names
# the benchmark, the URL and the publication date it came from.

# What to call each of those URLs in a report, so the evidence tables
# can link a readable title instead of printing a bare URL. A URL not
# listed here falls back to the `sources:` titles in models.yaml, and
# then to the URL itself.
source_titles:
  https://artificialanalysis.ai/models: "Artificial Analysis models index"
  https://artificialanalysis.ai/models/releases: "Artificial Analysis model releases, effort pricing"
  https://kilo.ai/leaderboard: "KiloBench leaderboard"
  https://snorkel.ai/leaderboard/terminal-bench-4-0: "Snorkel: Terminal-Bench 4.0 leaderboard"
  https://tokenmix.ai/blog/claude-opus-5-review-pricing-benchmarks-2026: "TokenMix: Claude Opus 5 review, pricing and benchmarks"
  https://vulcanbench.com/benchmarks/10-opus5-effort.html: "VulcanBench report 10: Opus 5 across efforts"
  https://vulcanbench.com/benchmarks/12: "VulcanBench report 12"
  https://vulcanbench.com/benchmarks/13: "VulcanBench report 13"
  https://vulcanbench.com/benchmarks/swe-v4-astra-fable51-v34.html: "VulcanBench-SWE v4 report 34: Astra against Fable 5.1"

