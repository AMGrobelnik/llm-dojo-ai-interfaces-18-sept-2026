# Agentic-LLM catalogue for scripts/rank_llms.py.
#
# list_price is the OpenRouter catalogue LIST price in $/M tokens, with
# temporary per-endpoint discounts deliberately ignored (see SKILL.md).
# Where a model currently rides a discount the cheaper route is recorded
# in `discount_route` so the saving is visible without polluting the
# ranking with a price that is about to lapse.
#
# Every entry in `scores` is {value, src}; `src` keys into `sources`
# below, which carries the URL and the publication date. A score with no
# dated third-party source is not recorded at all — it is `rejected` or
# left absent, never guessed.
#
# `context_window`, `max_output_tokens` and `tool_calling` are the hard
# requirements a task group can demand (data/task_groups.yaml
# `requirements:`). They come from the same OpenRouter models API the
# price capture reads — context_length, top_provider.max_completion_tokens
# and whether supported_parameters carries "tools" — cited as `or_caps`.
# A row the catalogue does not list keeps its recorded context_window and
# leaves the other two `null`: unknown is not a failure, so only a field
# with a value below a group's floor excludes the row.
#
# agentic: true means the model has at least one published coding,
# tool-use or terminal-driving result. Vision-first, chat-only and
# teaser-priced models are recorded with `rejected` and are skipped by
# the ranker unless --include-rejected is passed.
#
# `evidence: none` means the catalogue prices the model and no board this
# skill carries has a row for it. It is a statement about the `scores:`
# block below it, so a row carrying BOTH the tag and scores is a data
# error: the ranker keeps the scores, ranks the row and logs a warning
# naming it.
#
# `alias_of: <id>` marks a moving alias whose id currently resolves to a
# pinned dated snapshot already in this file. One purchasable endpoint is
# one point on the frontier, so the ranker folds the alias's scores into
# the snapshot (the snapshot's own value wins where both have a board,
# and the snapshot's price stands) and leaves the alias out of every
# table but the routing note.

