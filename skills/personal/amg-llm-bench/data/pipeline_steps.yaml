    minutes_median: 7
    cost_usd_median: 0.68
    input_tokens_median: 166100
    output_tokens_median: 19000
    cache_read_tokens_median: 470592
    failure_rate: 0.02
    failure_note: output_format validation
    note: >-
      Originating a novel, literature-grounded hypothesis with no
