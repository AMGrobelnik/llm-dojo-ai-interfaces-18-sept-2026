# Measured difficulty of every agentic research pipeline step.
#
# Evidence: 359 real pipeline runs, medians per step, `n` = number of
# task_end occurrences. This is the ground truth the three difficulty
# levels are cut from — a step's level is an observation, not a guess.
# `group` names the task group in data/task_groups.yaml whose capability
# score applies to that step.
#
# Source: in-repo run-journal aggregation, 2026-09-18 (359 runs sampled
# from the run history; non-LLM repo steps _1_gh_repo and _5_deploy_gh
# are excluded because model choice does not apply to git plumbing).

evidence:
  runs_sampled: 359
  date: 2026-09-18
  method: >-
    Median over task_end events per step, aggregated by
    scripts/aggregate_steps.py directly from the DBOS run
    journal (dbos.operation_outputs); failures counted as any
    task_end event with status != 'done'.

levels:
  3: >-
    Hardest. Open-ended engineering or invention with real failure
    modes; 2-4x the resource footprint of any other tier.
  2: >-
    Moderate. Real judgment or synthesis over material the pipeline has
    already produced, or a modest step with a high relative failure rate.
  1: >-
    Easiest. Bounded, short, near-zero observed failures.

steps:
  - step: execute.experiment
    group: coding-experiments
    level: 3
    n: 87
    tool_calls_median: 90
    minutes_median: 24
    cost_usd_median: 3.17
    input_tokens_median: 17700
    output_tokens_median: 42218
    cache_read_tokens_median: 5200000
    failure_rate: 0.25
    failure_note: agent crash, no output files, schema fail

  - step: execute.dataset
    group: coding-experiments
    level: 3
    n: 80
    tool_calls_median: 88
    minutes_median: 21
    cost_usd_median: 2.91
    input_tokens_median: 469814
    output_tokens_median: 34250
    cache_read_tokens_median: 4750000
    failure_rate: 0.09
    failure_note: agent crash

  - step: execute.evaluation
    group: coding-experiments
    level: 3
    n: 23
    tool_calls_median: 53
    minutes_median: 13
    cost_usd_median: 1.88
    input_tokens_median: 6062
    output_tokens_median: 25918
    cache_read_tokens_median: 3000000
    failure_rate: 0.13

  - step: execute.proof
    group: research-reasoning
    level: 3
    n: 3
    tool_calls_median: 206
    minutes_median: 19
    cost_usd_median: 8.04
    input_tokens_median: 1233383
    output_tokens_median: 146421
    cache_read_tokens_median: 10900000
    failure_rate: 0.0
    note: >-
      Only 3 runs in the sample used this artifact type — still
      thin evidence, but now measured, not analogized: the highest
      cost, tool-call and token footprint of any step, confirming
      level 3 rather than assuming it.

  - step: execute.research
    group: research-reasoning
    level: 3
    n: 91
    tool_calls_median: 40
    minutes_median: 10
    cost_usd_median: 1.0
    input_tokens_median: 153000
    output_tokens_median: 34086
    cache_read_tokens_median: 1400000
    failure_rate: 0.04

  - step: gen_hypo
